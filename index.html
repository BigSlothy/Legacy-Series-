        <td><input class="ad-in sm" type="number" min="1" value="${esc(ov.age || '')}" onchange="adminDriverField(${d.id},'age',this.value)"></td>
        <td><input class="ad-in" value="${esc(ov.hometown || '')}" placeholder="City, State, Country" onchange="adminDriverField(${d.id},'hometown',this.value)"></td>
        <td><input class="ad-in sm" type="number" value="${esc(d.iRating == null ? '' : d.iRating)}" onchange="adminDriverField(${d.id},'iRating',this.value)"></td>
        <td><input class="ad-in sm" value="${esc(d.srOverride || baseSR(d))}" placeholder="A 3.57" onchange="adminDriverField(${d.id},'srText',this.value)"></td>
        <td><select class="ad-in" onchange="adminDriverTeam(${d.id}, this.value)">${teamOpts(ov.team || '')}</select></td>
        <td>${L.seasons.length > 1 ? `<details class="ad-det"><summary>By season</summary>${L.seasons.map(se => {
          const cur = ov.teamBySeason && Object.prototype.hasOwnProperty.call(ov.teamBySeason, se.id) ? (ov.teamBySeason[se.id] || '') : '__default__';
          return `<label class="ad-lab">${esc(se.name)}<select class="ad-in" onchange="adminDriverSeasonTeam(${d.id},'${se.id}', this.value)">
            ${teamOpts(cur, `<option value="__default__" ${cur === '__default__' ? 'selected' : ''}>Same as default</option>`)}</select></label>`;
        }).join('')}</details>` : '<span class="dim">—</span>'}</td>
        <td><button class="ad-x" onclick="if(confirm('Remove ${esc(d.name).replace(/'/g, '')} and every result they have?')) adminRemoveDriver(${d.id})">Remove</button></td>
      </tr>`;
  }).join('');

  setApp(`
    <div class="admin-wrap">
      <div class="back-row"><button class="back-link" onclick="location.hash=''">&larr; Back to the site</button></div>
      <div class="list-header"><h1>League Admin</h1></div>
      <p class="dash-sub">Changes here are made in your browser only. When you're happy, press <b>Download league-data.json</b> and upload it to your repository's <b>data</b> folder to publish.</p>
      ${adminMsg ? `<div class="ad-msg">${esc(adminMsg)}</div>` : ''}

      <div class="hist-h">SAVE / LOAD</div>
      <div class="ad-row">
        <button class="log-btn ad-btn" onclick="adminDownload()">Download league-data.json</button>
        <label class="ad-file">Load an existing league-data.json<input type="file" accept=".json" onchange="adminLoadFile(this.files[0])"></label>
      </div>

      <div class="hist-h">SEASONS</div>
      <p class="ad-note">Seasons are created automatically from your race files. Rename them, force one complete or in progress, or add an empty season to set up your roster before the first race.</p>
      <div class="drivers-wrap">
        <table class="drivers-table ad-table">
          <thead><tr><th>Name</th><th>Year</th><th>Races</th><th>Status</th><th></th></tr></thead>
          <tbody>${seasonRows || '<tr><td colspan="5" class="dim">No seasons yet.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="ad-row" style="margin-top:12px">
        <input class="ad-in" id="newSeasonName" placeholder="New season name" style="max-width:240px">
        <input class="ad-in" id="newSeasonDate" type="date" style="max-width:170px">
        <button class="ad-x add" onclick="adminAddSeason()">Add season</button>
      </div>

      <div class="hist-h">RACE RESULTS</div>
      <p class="ad-note">Add an official iRacing <b>.json</b> result file, or create a race by hand. Use <b>Edit</b> to change any driver's start, finish, laps, incidents or points. Every statistic on the site is calculated from these results, so editing them updates everything.</p>
      <label class="ad-file big">Add iRacing result file(s) (.json)<input type="file" accept=".json" multiple onchange="adminAddFiles(this.files)"></label>
      <div class="ad-row" style="margin:14px 0">
        <select class="ad-in" id="newRaceSeason" style="max-width:220px">${seasonOpts || '<option value="">No seasons</option>'}</select>
        <input class="ad-in" id="newRaceTrack" placeholder="Track" style="max-width:220px">
        <input class="ad-in" id="newRaceDate" type="date" style="max-width:170px">
        <button class="ad-x add" onclick="adminNewRace()">Create race by hand</button>
      </div>
      <div class="drivers-wrap">
        <table class="drivers-table">
          <thead><tr><th>Date</th><th>Season</th><th>Wk</th><th>Track</th><th>Drivers</th><th>Winner</th><th></th></tr></thead>
          <tbody>${raceList.length ? raceList.map(r => {
            const w = r.results.find(x => x.fin === 1);
            const se = L.seasonById[r.seasonId];
            const wk = se ? se.races.find(x => x.id === r.id) : null;
            return `<tr><td>${dateLabel(r.date)}</td>
              <td>${esc(se ? se.name : r.seasonName)}</td><td>${wk ? wk.week : ''}</td><td>${esc(r.track)}</td><td>${r.results.length}</td>
              <td>${w ? esc(w.n) : ''}</td>
              <td><button class="ad-x add" onclick="adminEditRace(${r.id})">Edit</button>
                <button class="ad-x" onclick="if(confirm('Remove this race?')) adminRemoveRace(${r.id})">Remove</button></td></tr>`;
          }).join('') : '<tr><td colspan="7" class="dim">No races yet.</td></tr>'}</tbody>
        </table>
      </div>

      <div class="hist-h">LEAGUE SETTINGS</div>
      <div class="ad-grid">
        <label class="ad-lab">League name<input class="ad-in" value="${esc(cfg.leagueName)}" onchange="adminSet('leagueName', this.value)"></label>
        <label class="ad-lab">Races per season<input class="ad-in" type="number" min="1" value="${cfg.racesPerSeason}" onchange="adminSet('racesPerSeason', this.value)"></label>
        <label class="ad-lab">Seasons per year<input class="ad-in" type="number" min="1" value="${cfg.seasonsPerYear}" onchange="adminSet('seasonsPerYear', this.value)"></label>
      </div>
      <p class="ad-note">A season counts as complete once it has the full number of races (or when the next season starts), unless you force it above. Titles, awards and the Dash For Cash payouts are decided when a season completes. Champion of the Year needs the same driver to win every season of a year.</p>

      <div class="hist-h">RANK TIERS</div>
      <p class="ad-note">One per line: <b>Name, first place, last place, color</b></p>
      <textarea class="ad-text" rows="${cfg.tiers.length + 1}" onchange="adminSetTiers(this.value)">${esc(cfg.tiers.map(t => `${t.name}, ${t.min}, ${t.max}, ${t.color}`).join('\n'))}</textarea>

      <div class="hist-h">THE DASH FOR CASH</div>
      <div class="ad-grid">
        <label class="ad-lab">Enabled<select class="ad-in" onchange="adminSetDash('enabled', this.value === '1')"><option value="1" ${dc.enabled ? 'selected' : ''}>On</option><option value="0" ${dc.enabled ? '' : 'selected'}>Off</option></select></label>
        <label class="ad-lab">Prize pool ($)<input class="ad-in" type="number" min="0" value="${dc.pot}" onchange="adminSetDash('pot', this.value)"></label>
        <label class="ad-lab">Final races counted<input class="ad-in" type="number" min="1" value="${dc.finalRaces}" onchange="adminSetDash('finalRaces', this.value)"></label>
        <label class="ad-lab">Max deduction (%)<input class="ad-in" type="number" min="0" max="100" value="${dc.maxDeductionPct}" onchange="adminSetDash('maxDeductionPct', this.value)"></label>
      </div>
      <label class="ad-lab">Base payouts by position ($, comma separated)<input class="ad-in" value="${esc(dc.base.join(', '))}" onchange="adminSetDash('base', this.value)"></label>
      <label class="ad-lab">Clean bonus shares by cleanliness rank (%, comma separated)<input class="ad-in" value="${esc(dc.share.join(', '))}" onchange="adminSetDash('share', this.value)"></label>
      <p class="ad-note">Base payouts add up to $${fmt(sumOf(dc.base, x => x))} against a $${fmt(dc.pot)} pool, and bonus shares add up to ${sumOf(dc.share, x => x)}%.</p>

      <div class="hist-h">TEAMS</div>
      <div class="ad-teams">
        ${DATA.teams.map(t => `
          <div class="ad-team">
            <input type="color" value="${esc(t.color)}" onchange="adminTeamField('${esc(t.id)}','color',this.value)">
            <input class="ad-in" value="${esc(t.name)}" onchange="adminTeamField('${esc(t.id)}','name',this.value)">
            <button class="ad-x" onclick="if(confirm('Remove this team?')) adminRemoveTeam('${esc(t.id)}')">Remove</button>
          </div>`).join('') || '<p class="ad-note">No teams yet.</p>'}
        <div class="ad-team">
          <input type="color" id="newTeamColor" value="#E8A33D"><input class="ad-in" id="newTeamName" placeholder="New team name">
          <button class="ad-x add" onclick="adminAddTeam()">Add team</button>
        </div>
      </div>

      <div class="hist-h">ADD A DRIVER</div>
      <p class="ad-note">Add a driver without a race result, for example to set up your roster before the season starts. They show on the Drivers page with zero stats and fill in once they have results. The iRacing customer ID is optional; if you know it, results from iRacing files will match them automatically.</p>
      <div class="ad-grid">
        <label class="ad-lab">Name<input class="ad-in" id="newDrvName" placeholder="Full name"></label>
        <label class="ad-lab">iRacing customer ID (optional)<input class="ad-in" id="newDrvId" type="number" placeholder="e.g. 703766"></label>
        <label class="ad-lab">Car #<input class="ad-in" id="newDrvNum"></label>
        <label class="ad-lab">Age<input class="ad-in" id="newDrvAge" type="number" min="1"></label>
        <label class="ad-lab">Hometown<input class="ad-in" id="newDrvTown" placeholder="City, State, Country"></label>
        <label class="ad-lab">Team<select class="ad-in" id="newDrvTeam">${teamOpts('')}</select></label>
      </div>
      <button class="ad-x add" onclick="adminAddDriver()">Add driver</button>

      <div class="hist-h" style="margin-top:28px">DRIVERS</div>
      <p class="ad-note">Every driver here can be edited, including the ones added automatically from race files. Change any field and it applies straight away; clear a name, car number, iRating or safety rating to go back to what iRacing reported. iRacing gives no team, age or hometown, so fill those in here. Use "By season" if a driver changed teams.</p>
      <div class="drivers-wrap">
        <table class="drivers-table ad-table">
          <thead><tr><th>Name</th><th>Car #</th><th>Age</th><th>Hometown</th><th>iRating</th><th>Safety rating</th><th>Team</th><th>Team history</th><th></th></tr></thead>
          <tbody>${driverRows || '<tr><td colspan="9" class="dim">No drivers yet.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="ad-row" style="margin-top:20px"><button class="log-btn ad-btn" onclick="location.hash=''">Preview the site</button></div>
    </div>`, keepScroll);
}

function renderRaceEditor(keepScroll){
  const r = getRace();
  const drivers = [...L.drivers].sort((a, b) => a.name.localeCompare(b.name));
  const driverOpts = (sel) => drivers.map(d => `<option value="${d.id}" ${d.id === sel ? 'selected' : ''}>${esc(d.name)}</option>`).join('');
  const order = r.results.map((x, i) => ({ x, i })).sort((a, b) => a.x.fin - b.x.fin);
  const finishes = r.results.map(x => x.fin);
  const warn = [];
  if (r.results.length && !finishes.includes(1)) warn.push('No driver has finishing position 1.');
  if (new Set(finishes).size !== finishes.length) warn.push('Two drivers share the same finishing position.');
  if (new Set(r.results.map(x => x.c)).size !== r.results.length) warn.push('A driver appears more than once.');
  if (new Set(r.results.map(x => x.st)).size !== r.results.length) warn.push('Two drivers share the same starting position.');
  const led = sumOf(r.results, x => x.ll), laps = r.laps || Math.max(0, ...r.results.map(x => x.lc));
  if (r.results.length && laps && led !== laps) warn.push(`Laps led add up to ${led}, but the race was ${laps} laps.`);
  const row = ({ x, i }) => `
    <tr>
      <td><select class="ad-in" onchange="adminResultField(${i},'c',this.value)">${driverOpts(x.c)}</select></td>
      <td><input class="ad-in sm" value="${esc(x.no)}" onchange="adminResultField(${i},'no',this.value)"></td>
      <td><input class="ad-in sm" type="number" min="1" value="${x.st}" onchange="adminResultField(${i},'st',this.value)"></td>
      <td><input class="ad-in sm" type="number" min="1" value="${x.fin}" onchange="adminResultField(${i},'fin',this.value)"></td>
      <td><input class="ad-in" style="width:120px" value="${esc(x.out)}" onchange="adminResultField(${i},'out',this.value)"></td>
      <td><input class="ad-in sm" type="text" value="${esc(x.fin === 1 ? '-' : (x.ivt || (x.iv > 0 ? (x.iv / 10000).toFixed(4) : '')))}" placeholder="${x.fin === 1 ? '-' : '2.7952 or -1L'}" onchange="adminResultField(${i},'gap',this.value)"></td>
      <td><input class="ad-in sm" type="number" min="0" value="${x.lc}" onchange="adminResultField(${i},'lc',this.value)"></td>
      <td><input class="ad-in sm" type="number" min="0" value="${x.ll}" onchange="adminResultField(${i},'ll',this.value)"></td>
      <td><input class="ad-in sm" type="number" min="0" value="${x.inc}" onchange="adminResultField(${i},'inc',this.value)"></td>
      <td><input class="ad-in sm" type="number" value="${x.pts}" onchange="adminResultField(${i},'pts',this.value)"></td>
      <td><button class="ad-x" onclick="adminRemoveResult(${i})">Remove</button></td>
    </tr>`;
  setApp(`
    <div class="admin-wrap">
      <div class="back-row"><button class="back-link" onclick="adminCloseRace()">&larr; Back to admin</button></div>
      <div class="list-header"><h1>Edit Race</h1></div>
      <p class="dash-sub">Changes apply straight away in this browser. Press <b>Back to admin</b>, then <b>Download league-data.json</b> to save them.</p>
      ${adminMsg ? `<div class="ad-msg">${esc(adminMsg)}</div>` : ''}
      ${warn.length ? `<div class="ad-msg warn">${warn.map(esc).join('<br>')}</div>` : ''}
      <div class="ad-grid">
        <label class="ad-lab">Season<select class="ad-in" onchange="adminRaceField('seasonId', this.value)">${[...L.seasons].reverse().map(se => `<option value="${se.id}" ${se.id === r.seasonId ? 'selected' : ''}>${esc(se.name)}</option>`).join('')}</select></label>
        <label class="ad-lab">Track<input class="ad-in" value="${esc(r.track)}" onchange="adminRaceField('track', this.value)"></label>
        <label class="ad-lab">Date<input class="ad-in" type="date" value="${esc(String(r.date).slice(0, 10))}" onchange="adminRaceField('date', this.value)"></label>
        <label class="ad-lab">Race length (laps)<input class="ad-in" type="number" min="0" value="${r.laps || 0}" onchange="adminRaceField('laps', this.value)"></label>
      </div>
      <div class="hist-h">RESULTS (${r.results.length} DRIVERS)</div>
      <div class="drivers-wrap">
        <table class="drivers-table ad-table">
          <thead><tr><th>Driver</th><th>Car #</th><th>Start</th><th>Finish</th><th>Status</th><th>Gap</th><th>Laps done</th><th>Laps led</th><th>Incidents</th><th>Points</th><th></th></tr></thead>
          <tbody>${order.map(row).join('') || '<tr><td colspan="11" class="dim">No results yet. Add a driver below.</td></tr>'}</tbody>
        </table>
      </div>
      <div class="ad-row" style="margin-top:14px">
        <select class="ad-in" id="newResultDriver" style="max-width:260px">${driverOpts(-1)}</select>
        <button class="ad-x add" onclick="adminAddResult()">Add driver to this race</button>
      </div>
      <p class="ad-note">Gap works like iRacing: the leader shows <b>-</b>, cars on the lead lap show their gap in seconds (for example <b>2.7952</b>, or the raw number from the iRacing file such as <b>27952</b>), and cars laps down show <b>-1L</b>, <b>-43L</b> and so on. Leave it blank to work it out from laps completed. Status is "Running" for a normal finish; anything else (for example "Crash" or "Disconnected") counts as a DNF. Points are entered as awarded by your league scoring.</p>
      <div class="ad-row" style="margin-top:18px">
        <button class="log-btn ad-btn" onclick="adminCloseRace()">Done</button>
        <button class="ad-x" onclick="if(confirm('Delete this whole race?')) adminRemoveRace(${r.id})">Delete race</button>
      </div>
    </div>`, keepScroll);
}

/* ------------------------------ boot and routing ------------------------------ */
function normalizeData(d){
  d = d || {};
  return { config: d.config || {}, teams: Array.isArray(d.teams) ? d.teams : [], seasons: d.seasons || {}, drivers: d.drivers || {}, races: Array.isArray(d.races) ? d.races : [] };
}
let loadError = '';

function route(){
  closeDriverMenu();
  const hash = location.hash.replace('#', '');
  if (hash === 'admin'){ renderAdmin(); return; }
  if (loadError && !L.drivers.length){
    setIntro('');
    setApp(emptyState('Could not load the league data', `${esc(loadError)}<br><br>If you opened this file straight from your computer, browsers block loading data that way — open the published website instead, or load a file in the ${adminLink}.`));
    return;
  }
  const m = hash.match(/^([a-z]+)(?:-(.+))?$/) || [];
  switch (m[1]){
    case 'driver':      return renderDetail(m[2]);
    case 'season':      return renderSeasonDetail(m[2]);
    case 'log':         return renderLog(m[2]);
    case 'teams':       return renderTeams(window.__lastTeamSort);
    case 'team':        return renderTeamDetail(m[2]);
    case 'teamhistory': return renderTeamHistory(m[2]);
    case 'dash':        return renderDash(m[2]);
    default:            return renderDrivers(window.__lastSort);
  }
}

async function boot(){
  DATA = normalizeData({});
  try {
    const res = await fetch('data/league-data.json?v=' + Date.now());
    if (!res.ok) throw new Error(`data/league-data.json returned ${res.status}`);
    DATA = normalizeData(await res.json());
  } catch (e) { loadError = e.message; }
  rebuild();
  route();
}
window.addEventListener('hashchange', route);
if (typeof document !== 'undefined' && document.getElementById('app')) boot();
</script>
</body>
