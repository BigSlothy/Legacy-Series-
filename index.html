<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver Stats</title>
<meta name="description" content="League driver stats, standings, teams, career logs and the Dash For Cash tournament.">
<meta property="og:type" content="website">
<meta property="og:title" content="Driver Stats">
<meta property="og:description" content="League driver stats, standings, teams, career logs and the Dash For Cash tournament.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0A0C0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0C0E; --panel:#14181D; --panel-2:#1B2028;
    --steel-line:#3A4350; --paper:#ECE9E2; --paper-dim:#A8AEB8;
    --red:#D8342A; --amber:#E8A33D;
  }
  html,body{height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:'Inter',sans-serif;
    padding: max(28px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
    min-height:100%;
  }
  .intro{max-width:640px; margin:0 auto 20px; text-align:center; color:var(--paper-dim); font-size:13px; line-height:1.5;}
  .intro b{color:var(--paper); font-weight:600;}

  .view-toggle{
    max-width:860px; margin:0 auto 20px; display:flex; background:var(--panel);
    border:1px solid var(--steel-line); border-radius:6px; padding:3px;
  }
  .vt-btn{
    flex:1; border:none; background:none; cursor:pointer; padding:9px 10px; border-radius:4px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.3px; color:var(--paper-dim);
  }
  .vt-btn.active{ background:var(--amber); color:#0b0d10; }
  .vt-btn:nth-child(4){ flex:2.2; }
  .vt-btn{ min-width:0; }
  @media (max-width:380px){ .vt-btn{ padding:9px 3px; font-size:12px; letter-spacing:0; } }


  .team-top{ display:flex; align-items:center; gap:14px; padding:22px 22px 14px; position:relative; }
  .team-badge{
    flex:0 0 auto; width:56px; height:56px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:#0b0d10; letter-spacing:.5px;
  }
  .team-name{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; letter-spacing:.3px; line-height:1.1; }
  .team-sub{ color:var(--paper-dim); font-size:12px; margin-top:4px; }
  .team-pos{ margin-left:auto; text-align:right; flex:0 0 auto; }
  .team-pos .v{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; line-height:1; }
  .team-pos .l{ font-size:9px; letter-spacing:.5px; color:var(--paper-dim); margin-top:3px; }
  .roster{ margin:0 22px 18px; }
  .roster-row{
    display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--steel-line);
    cursor:pointer; font-size:12.5px;
  }
  .roster-row:hover .r-name{ color:var(--amber); }
  .roster-row .r-num{ font-family:'Rajdhani',sans-serif; font-weight:700; width:30px; color:var(--paper-dim); }
  .roster-row .r-name{ flex:1; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; }
  .roster-row .r-pos{ color:var(--paper-dim); font-size:11.5px; }
  .roster-row .r-pts{ font-family:'Rajdhani',sans-serif; font-weight:700; width:52px; text-align:right; }

  .team-list{ max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .team-row{
    display:grid; grid-template-columns:230px minmax(300px,1.25fr) 170px minmax(280px,1.15fr);
    align-items:stretch; cursor:default;
  }
  .team-row > div{ position:relative; padding:20px 20px; border-left:1px solid var(--steel-line); min-width:0; }
  .team-row > div:first-child{ border-left:none; }
  .team-row.clickable{ cursor:pointer; }
  .team-row .tr-id{ display:flex; flex-direction:column; justify-content:center; gap:14px; }
  .team-row .tr-id .team-pos{ margin-left:0; text-align:left; }
  .team-row .tr-id-text{ min-width:0; }
  .team-row .tr-season .headline, .team-row .tr-season .stats{ margin-left:0; margin-right:0; }
  .team-row .tr-season .stats{ margin-bottom:0; }
  .team-row .tr-career .h, .team-row .tr-roster .h{ font-size:11px; letter-spacing:.5px; color:var(--paper-dim); margin-bottom:10px; }
  .team-row .tr-career .chips{ flex-direction:column; align-items:flex-start; }
  .team-row .roster{ margin:0; }
  @media (max-width:1100px){
    .team-row{ grid-template-columns:1fr 1fr; }
    .team-row > div:nth-child(odd){ border-left:none; }
    .team-row > div:nth-child(n+3){ border-top:1px solid var(--steel-line); }
  }
  @media (max-width:640px){
    .team-row{ grid-template-columns:1fr; }
    .team-row > div{ border-left:none; }
    .team-row > div + div{ border-top:1px solid var(--steel-line); }
    .team-row .tr-id{ flex-direction:row; align-items:center; justify-content:flex-start; flex-wrap:wrap; }
    .team-row .tr-id .team-pos{ margin-left:auto; text-align:right; }
  }

  .driver-menu{
    position:fixed; z-index:50; min-width:210px; background:var(--panel-2);
    border:1px solid var(--steel-line); border-radius:6px; overflow:hidden;
    box-shadow:0 18px 40px -10px rgba(0,0,0,.7);
  }
  .driver-menu .dm-title{
    padding:10px 14px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.3px; color:var(--paper-dim); border-bottom:1px solid var(--steel-line);
  }
  .driver-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--paper); font-family:'Inter',sans-serif; font-size:13px; padding:11px 14px;
  }
  .driver-menu button:hover{ background:var(--panel); color:var(--amber); }
  .driver-menu button + button{ border-top:1px solid var(--steel-line); }
  .driver-menu button:disabled{ opacity:.45; cursor:not-allowed; }
  .driver-menu button:disabled:hover{ background:none; color:var(--paper); }
  .driver-menu .dm-lock{ margin-left:8px; font-size:10px; letter-spacing:.6px; color:var(--paper-dim); border:1px solid var(--steel-line); border-radius:3px; padding:1px 5px; }
  :where(button.hub-link){ font-family:inherit; font-size:inherit; }
  button.hub-link{ background:none; border:0; padding:0; cursor:pointer; text-align:left; line-height:inherit; }
  tr.row-hl td{ background:rgba(232,163,61,.16); box-shadow:inset 0 2px 0 var(--amber), inset 0 -2px 0 var(--amber); }
  tr.row-hl td:first-child{ box-shadow:inset 4px 0 0 var(--amber), inset 0 2px 0 var(--amber), inset 0 -2px 0 var(--amber); }
  .season-actions{ margin-top:16px; }
  .rules-card{ background:var(--panel); border:1px solid var(--steel-line); border-radius:8px; padding:18px 22px; margin-bottom:22px; font-size:13.5px; line-height:1.6; color:var(--paper-dim); }
  .rules-card p{ margin:0 0 10px; }
  .rules-card b{ color:var(--paper); }
  .rules-card h3{ font-family:'Rajdhani',sans-serif; font-size:14px; letter-spacing:.8px; color:var(--paper); margin:16px 0 6px; }
  .rules-page .mini-table{ font-size:13.5px; }

  .drivers-wrap{
    max-width:1180px; margin:0 auto; overflow-x:auto; border:1px solid var(--steel-line);
    border-radius:6px; background:var(--panel);
  }
  .drivers-table{ width:100%; border-collapse:collapse; white-space:nowrap; font-size:13px; }
  .drivers-table th, .drivers-table td{ padding:12px 14px; text-align:left; border-bottom:1px solid var(--steel-line); }
  .drivers-table thead th{
    background:var(--panel-2); color:var(--paper-dim); font-family:'Rajdhani',sans-serif;
    font-weight:700; font-size:11px; letter-spacing:.6px; text-transform:uppercase;
  }
  .drivers-table tr.grp th{ border-bottom:1px solid var(--steel-line); }
  .drivers-table tr.grp th.grp-title{
    text-align:center; color:var(--amber); font-size:17px; font-weight:700; letter-spacing:1.5px; padding:14px;
  }
  .drivers-table tbody tr:hover{ background:rgba(255,255,255,.03); }
  .drivers-table td{ font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; }
  .drivers-table .c-sep{ border-left:1px solid var(--steel-line); }
  .drivers-table .c-pts{ font-weight:700; color:var(--amber); }
  .pos-wrap{ display:inline-flex; align-items:center; gap:8px; }
  .pos-wrap b{ font-size:16px; min-width:20px; }
  .name-link{
    background:none; border:none; padding:0; cursor:pointer; text-align:left;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:var(--paper);
    text-decoration:underline; text-decoration-color:var(--steel-line); text-underline-offset:4px;
  }
  .name-link:hover{ color:var(--amber); text-decoration-color:var(--amber); }
  .name-link .n-num{ color:var(--paper-dim); font-weight:600; margin-right:2px; }
  .n-tier{ font-family:'Inter',sans-serif; font-size:10px; letter-spacing:.7px; margin-top:3px; font-weight:600; }
  .team-link{ font-size:14px; }
  .team-detail{ max-width:1180px; margin:0 auto; }
  .c-team{ font-family:'Inter',sans-serif; font-size:12.5px; line-height:1.35; }
  .c-team b{ font-family:'Rajdhani',sans-serif; font-size:14px; }
  .c-team div{ color:var(--paper-dim); font-weight:400; }

  .hist-sub{ text-align:center; color:var(--paper-dim); font-size:13px; margin:-6px 0 22px; }
  .hist-h{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:1.2px;
    color:var(--paper); border-left:4px solid var(--amber); padding:2px 0 2px 12px; margin:6px 0 14px;
  }
  .totals-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; margin-bottom:28px; }
  .tot{ background:var(--panel); border:1px solid var(--steel-line); border-radius:6px; padding:16px 10px; text-align:center; }
  .tot .n{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:28px; color:var(--amber); line-height:1.1; }
  .tot .l{ font-size:11px; letter-spacing:.4px; color:var(--paper-dim); margin-top:5px; }
  .n-status{ font-family:'Inter',sans-serif; font-size:10.5px; color:var(--paper-dim); margin-top:3px; font-weight:500; }
  .plain-name{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; }
  .plain-name .n-num{ color:var(--paper-dim); font-weight:600; }
  .drivers-table td.c-award{ white-space:normal; min-width:150px; }
  .drivers-table td.c-award .chip{ font-size:11.5px; padding:3px 7px; }
  .dim{ color:var(--paper-dim); }

  .dash-wrap{ max-width:1180px; margin:0 auto; }
  .dash-sub{ text-align:center; color:var(--paper-dim); font-size:13px; line-height:1.5; margin:-6px auto 22px; max-width:680px; }
  .pool-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:26px; }
  .dash-table .c-final{ font-weight:700; color:var(--paper); }
  .dash-table td small{ display:block; font-family:'Inter',sans-serif; font-size:10.5px; color:var(--paper-dim); font-weight:500; }
  .neg{ color:#E5694D; } .pos{ color:#3EA66B; }
  .pos-badge{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; color:#101214;
  }
  .clean-pill{
    display:inline-block; padding:2px 10px; border-radius:999px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px;
    background:#F4E7D3; color:#6a3d12;
  }
  .clean-pill.p1{ background:#D8F3EA; color:#0e5a43; }
  .mult{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px; margin-right:6px; color:var(--paper-dim); }
  .mult.m0{ color:var(--paper-dim); } .mult.m2{ color:var(--amber); } .mult.m4{ color:#E5694D; }
  .rules-box{ margin-top:26px; border:1px solid var(--steel-line); border-radius:6px; background:var(--panel); }
  .rules-box > summary{ padding:14px 16px; cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px; }
  .rules-body{ padding:0 18px 18px; font-size:13px; line-height:1.6; color:var(--paper-dim); }
  .rules-body h3{ font-family:'Rajdhani',sans-serif; font-size:14px; letter-spacing:.8px; color:var(--paper); margin:16px 0 6px; }
  .rules-cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; }
  .mini-table{ border-collapse:collapse; font-size:12.5px; }
  .mini-table td{ padding:4px 16px 4px 0; border-bottom:1px solid var(--steel-line); }
  .mini-table td:last-child{ color:var(--paper); font-weight:600; }

  .cutoff{ display:flex; align-items:center; gap:14px; margin:26px 0 8px; }
  .cutoff::before, .cutoff::after{ content:''; flex:1; border-top:2px dashed #E5694D; }
  .cutoff span{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:2px; color:#E5694D; }
  .cutoff-sub{ text-align:center; color:var(--paper-dim); font-size:12.5px; margin:0 0 14px; }
  .pos-badge.out{ background:var(--panel-2); color:var(--paper-dim); border:1px solid var(--steel-line); }

  .cutoff.in{ margin:4px 0 12px; }
  .cutoff.in::before, .cutoff.in::after{ border-top-color:#3EA66B; }
  .cutoff.in span{ color:#3EA66B; }

  .name-line{ display:flex; align-items:center; gap:10px; }
  .rank-tag{ display:inline-flex; align-items:center; gap:4px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.6px; text-transform:uppercase; }
  .rank-tag .gem-sm{ width:14px; height:14px; }

  .totals-flex{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-right:14px; }
  .dash-btn{
    flex:0 0 auto; border:none; cursor:pointer; background:var(--amber); color:#0b0d10; border-radius:5px; padding:10px 14px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.4px; white-space:nowrap;
  }
  .dash-btn:hover{ filter:brightness(1.08); }
  .dash-tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tot.sm{ padding:12px 6px; }
  .tot.sm .n{ font-size:20px; }
  .tot.sm .n .of{ font-size:13px; color:var(--paper-dim); font-weight:600; }
  .tot.sm .l{ font-size:10px; }

  .list-header{ max-width:1180px; margin:0 auto 18px; text-align:center; }
  .list-header h1{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:24px; letter-spacing:.5px;
    margin:0; color:var(--paper);
  }
  .legend{
    max-width:1180px; margin:0 auto 20px; padding:12px 16px; border-radius:6px;
    background:var(--panel); border:1px solid var(--steel-line);
    display:flex; flex-wrap:wrap; justify-content:center; gap:14px 22px;
  }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-item span:first-of-type{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:.3px; }
  .legend-range{ font-family:'Inter',sans-serif; font-size:11.5px; color:var(--paper-dim); }

  .controls{ max-width:1180px; margin:0 auto 20px; display:flex; justify-content:flex-end; position:relative; }
  .sort-btn{
    display:flex; align-items:center; gap:8px;
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; letter-spacing:.4px; color:var(--paper);
    background:var(--panel); border:1px solid var(--steel-line); border-radius:5px;
    padding:9px 14px; cursor:pointer;
  }
  .sort-btn:hover{ border-color:var(--amber); }
  .sort-btn svg{ transition:transform .15s ease; }
  .sort-btn[aria-expanded="true"] svg{ transform:rotate(180deg); }
  .sort-menu{
    display:none; position:absolute; top:calc(100% + 6px); right:0; z-index:5;
    background:var(--panel-2); border:1px solid var(--steel-line); border-radius:5px;
    overflow:hidden; min-width:200px; box-shadow:0 14px 30px -10px rgba(0,0,0,.6);
  }
  .sort-menu.open{ display:block; }
  .sort-menu button{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--paper); font-family:'Inter',sans-serif; font-size:13px;
    padding:10px 14px; cursor:pointer;
  }
  .sort-menu button:hover{ background:var(--panel); color:var(--amber); }
  .sort-menu button + button{ border-top:1px solid var(--steel-line); }

  .grid{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:22px;
  }

  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:3px solid var(--steel-line);
    border-radius:6px;
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
    cursor:pointer;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 34px);
    pointer-events:none;
  }

  .head{ padding:22px 22px 14px; display:flex; gap:16px; align-items:center; position:relative;}
  .number-plate{
    flex:0 0 auto; width:56px; height:56px; border-radius:50%;
    border:3px solid var(--paper); display:flex; align-items:center; justify-content:center;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:var(--paper);
    background:radial-gradient(circle at 30% 25%, #262b32, #14171b);
  }
  .id{flex:1; min-width:0;}
  .id .name{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; letter-spacing:.3px; line-height:1.1;}

  .ratings{flex:0 0 auto; text-align:right;}
  .ratings .row{margin-bottom:6px;}
  .ratings .row:last-child{margin-bottom:0;}
  .ratings .v{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:var(--paper); line-height:1;}
  .ratings .l{font-size:9px; color:var(--paper-dim); letter-spacing:.5px; margin-top:2px;}

  .subhead{ margin:0 22px 18px; padding-bottom:14px; border-bottom:1px solid var(--steel-line); }
  .subhead .team{color:var(--paper-dim); font-size:12.5px;}
  .subhead .team b{color:var(--amber); font-weight:600;}
  .subhead .meta{color:var(--paper-dim); font-size:11.5px; margin-top:6px;}

  .rank{
    margin:0 22px 18px; padding:12px 14px; border-radius:5px;
    background:var(--panel); border:1px solid var(--steel-line);
    display:flex; align-items:center; gap:12px;
  }
  .rank .gem{flex:0 0 auto; width:30px; height:30px;}
  .rank .gem polygon{stroke:rgba(0,0,0,.25); stroke-width:1;}
  .rank .rtext{flex:1; min-width:0;}
  .rank .tier{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px;}
  .rank .pos{font-size:11px; color:var(--paper-dim); margin-top:1px;}

  .headline{
    margin:0 22px 18px; padding:16px; border-radius:5px;
    background:var(--panel); border:1px solid var(--steel-line);
    display:grid; grid-template-columns:repeat(3,1fr); text-align:center;
  }
  .headline div + div{border-left:1px solid var(--steel-line);}
  .headline .n{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px;}
  .headline .l{font-size:10.5px; color:var(--paper-dim); margin-top:2px;}

  .stats{ margin:0 22px 18px; display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .stat{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--steel-line); }
  .stat .l{font-size:11.5px; color:var(--paper-dim);}
  .stat .v{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px;}
  .stat .v.hot{color:var(--red);}
  .stat .v.good{color:#3EA66B;}

  .section{ margin:0 22px 16px; }
  .section .h{ font-size:11px; letter-spacing:.5px; color:var(--paper-dim); margin-bottom:8px; }
  .section .empty{ font-size:12.5px; color:var(--paper-dim); font-style:italic; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12.5px;
    padding:5px 10px; border-radius:3px; background:var(--amber); color:#241a08;
  }
  .chip.green{ background:#3EA66B; color:#06210f; }
  .chip.champ{ background:linear-gradient(135deg,#8b5cf6,#6d28d9); color:#fff; }
  .chip.clean{ background:var(--panel); border:1px solid var(--steel-line); color:var(--paper); }

  .rank-history{ display:flex; flex-wrap:wrap; gap:8px; }
  .rank-chip{

<body>
  <p class="intro" id="intro"></p>
  <div id="app"><div class="empty-state"><p>Loading league data…</p></div></div>

<script>
'use strict';
// ============================================================================
// League tracker. Every page is calculated from real race results (official iRacing
// event_result data) stored in data/league-data.json. Nothing is simulated.
// ============================================================================

// Build flags set by the build script.
const PRIVATE = false;
const HOME = PRIVATE ? 'home' : '';     // the hub page (the private copy opens on its editor, so its hub is #home)

/* ------------------------------ helpers ------------------------------ */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (n) => Number(n).toLocaleString();
const ordinal = (n) => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const sumOf = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const slugify = (name) => String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const money = (c) => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lastName = (full) => String(full).trim().split(/\s+/).slice(-1)[0];
const gemSVG = (fill, cls) => `<svg class="${cls || 'gem-sm'}" viewBox="0 0 32 32"><polygon points="16,2 29,12 24,30 8,30 3,12" style="fill:${esc(fill)}"/></svg>`;

/* ------------------------------ configuration ------------------------------ */
const DEFAULT_CONFIG = {
  leagueName: 'My League',
  racesPerSeason: 15,
  seasonsPerYear: 2,
  awards: { cleanestMinRaces: 13 },
  tiers: [
    { name: 'Ruby',     min: 1,  max: 5,  color: '#FF5C7A' },
    { name: 'Diamond',  min: 6,  max: 10, color: '#8FC7FF' },
    { name: 'Platinum', min: 11, max: 15, color: '#7EE8D0' },
    { name: 'Gold',     min: 16, max: 20, color: '#F2C94C' },
    { name: 'Silver',   min: 21, max: 30, color: '#C7CDD3' },
    { name: 'Bronze',   min: 31, max: 40, color: '#C08A52' },
  ],
  dash: {
    enabled: true, pot: 600, finalRaces: 5, maxDeductionPct: 100,
    base:  [160, 100, 80, 64, 52, 40, 32, 26, 24, 22],   // $ by final standings position
    share: [25, 20, 15, 12, 10, 7, 5, 3, 2, 1],          // % of the Clean Bonus Pool by cleanliness rank
  },
};
function withDefaults(c){
  c = c || {};
  const d = c.dash || {};
  return {
    leagueName: c.leagueName || DEFAULT_CONFIG.leagueName,
    racesPerSeason: Math.max(1, +c.racesPerSeason || DEFAULT_CONFIG.racesPerSeason),
    seasonsPerYear: Math.max(1, +c.seasonsPerYear || DEFAULT_CONFIG.seasonsPerYear),
    awards: { cleanestMinRaces: Math.max(1, +((c.awards || {}).cleanestMinRaces) || DEFAULT_CONFIG.awards.cleanestMinRaces) },
    tiers: (c.tiers && c.tiers.length ? c.tiers : DEFAULT_CONFIG.tiers).map(t => ({ name: t.name, min: +t.min, max: +t.max, color: t.color || '#E8A33D' })),
    dash: {
      enabled: d.enabled !== false,
      pot: +d.pot || DEFAULT_CONFIG.dash.pot,
      finalRaces: Math.max(1, +d.finalRaces || DEFAULT_CONFIG.dash.finalRaces),
      maxDeductionPct: d.maxDeductionPct == null ? 100 : +d.maxDeductionPct,
      base: (d.base && d.base.length ? d.base : DEFAULT_CONFIG.dash.base).map(Number),
      share: (d.share && d.share.length ? d.share : DEFAULT_CONFIG.dash.share).map(Number),
    },
  };
}

/* ------------------------------ iRacing parser ------------------------------ */

/* ------------------------------ the league engine ------------------------------ */
let DATA = { config: {}, teams: [], drivers: {}, seasons: {}, races: [] };
let L = null;   // derived league, rebuilt from DATA whenever it changes

function licenseClass(level){ return level >= 21 ? 'Pro' : level >= 17 ? 'A' : level >= 13 ? 'B' : level >= 9 ? 'C' : level >= 5 ? 'D' : 'R'; }

function aggregate(rows){
  const a = { races: rows.length, wins: 0, top5: 0, top10: 0, poles: 0, points: 0, lapsLed: 0, lapsRun: 0, inc: 0, dnfs: 0,
    finishSum: 0, startSum: 0, bestStreak: 0 };
  let run = 0;
  rows.forEach(r => {
    a.points += r.points; a.lapsLed += r.lapsLed; a.lapsRun += r.lapsComp; a.inc += r.inc;
    a.finishSum += r.finish; a.startSum += r.start;
    if (r.dnf) a.dnfs++;
    if (r.finish <= 5) a.top5++;
    if (r.finish <= 10) a.top10++;
    if (r.start === 1) a.poles++;
    if (r.finish === 1){ a.wins++; run++; a.bestStreak = Math.max(a.bestStreak, run); } else run = 0;
  });
  a.avgFinish = rows.length ? a.finishSum / rows.length : null;
  a.avgStart = rows.length ? a.startSum / rows.length : null;
  a.incRace = rows.length ? a.inc / rows.length : null;
  return a;
}

function buildLeague(data){
  const cfg = withDefaults(data.config);
  const overrides = data.drivers || {};
  const seasonOv = data.seasons || {};
  const teams = (data.teams || []).map(t => ({ id: t.id, name: t.name, color: t.color || '#E8A33D' }));
  const teamById = Object.fromEntries(teams.map(t => [t.id, t]));
  const races = (data.races || []).filter(r => r.results && r.results.length)
    .slice().sort((a, b) => new Date(a.date) - new Date(b.date) || a.id - b.id);

  // seasons: every season that has races, plus any season added by hand
  const seasonMap = new Map();
  const getSeason = (id) => { if (!seasonMap.has(id)) seasonMap.set(id, { id, name: '', races: [] }); return seasonMap.get(id); };
  Object.keys(seasonOv).forEach(k => getSeason(Number(k)));
  races.forEach(r => getSeason(r.seasonId).races.push(r));
  const seasons = [...seasonMap.values()];
  seasons.forEach(se => {
    const o = seasonOv[se.id] || {};
    se.name = o.name || (se.races[0] ? se.races[0].seasonName : `Season ${Math.abs(se.id)}`);
    se.startDate = se.races[0] ? se.races[0].date : (o.startDate || new Date().toISOString());
  });
  seasons.sort((a, b) => new Date(a.startDate) - new Date(b.startDate) || a.id - b.id);
  seasons.forEach((se, i) => {
    const o = seasonOv[se.id] || {};
    se.index = i;
    se.year = new Date(se.startDate).getUTCFullYear();
    se.raceCount = se.races.length;
    se.complete = typeof o.complete === 'boolean' ? o.complete
      : ((i < seasons.length - 1 && se.raceCount > 0) || se.raceCount >= cfg.racesPerSeason);
    se.races.forEach((r, k) => { r.week = k + 1; });
  });
  const seasonById = Object.fromEntries(seasons.map(se => [se.id, se]));
  const current = seasons.length ? seasons[seasons.length - 1] : null;

  const teamFor = (id, seasonId) => {
    const ov = overrides[id] || {};
    if (ov.teamBySeason && Object.prototype.hasOwnProperty.call(ov.teamBySeason, seasonId)) return ov.teamBySeason[seasonId] || null;
    return ov.team || null;
  };

  // drivers and their race rows (chronological)
  const driverMap = new Map();
  races.forEach(r => {
    const winnerLaps = Math.max(0, ...r.results.map(x => x.lc));
    r.results.forEach(res => {
      let d = driverMap.get(res.c);
      if (!d){ d = { id: res.c, rows: [] }; driverMap.set(res.c, d); }
      const lapsDown = winnerLaps - res.lc;
      // Same layout as iRacing: the leader shows "-", cars on the lead lap show their gap in seconds,
      // and cars that are laps down show "-1L", "-2L" and so on.
      const interval = res.fin === 1 ? '-'
        : res.ivt ? res.ivt
        : res.iv > 0 ? (res.iv / 10000).toFixed(4)
        : lapsDown > 0 ? `-${lapsDown}L` : '-';
      const dnf = res.out !== 'Running';
      d.rows.push({
        seasonId: r.seasonId, raceId: r.id, week: r.week, date: r.date, track: r.track,
        start: res.st, finish: res.fin, status: dnf ? res.out : 'Running', dnf, interval,
        lapsLed: res.ll, lapsComp: res.lc, inc: res.inc, points: res.pts, field: r.results.length,
        teamId: teamFor(res.c, r.seasonId), number: res.no, carName: res.car, name: res.n,
        ir: res.ir, srl: res.srl, srs: res.srs, cc: res.cc,
      });
    });
  });
  // drivers added by hand exist even before they have a result
  Object.keys(overrides).forEach(k => {
    const id = Number(k);
    if (overrides[k] && overrides[k].manual && !driverMap.has(id)) driverMap.set(id, { id, rows: [] });
  });
  const drivers = [...driverMap.values()];
  drivers.forEach(d => {
    const last = d.rows.length ? d.rows[d.rows.length - 1] : null, ov = overrides[d.id] || {};
    d.manual = !!ov.manual;
    d.name = ov.name || (last ? last.name : `Driver ${Math.abs(d.id)}`);
    d.number = ov.number || (last ? last.number : '');
    d.age = ov.age || null;
    d.hometown = ov.hometown || '';
    d.car = last ? last.carName : '';
    d.country = last ? last.cc : '';
    d.iRating = ov.iRating != null && ov.iRating !== '' && !isNaN(+ov.iRating) ? +ov.iRating : (last ? last.ir : null);
    d.srl = last ? last.srl : null;
    d.sr = last && last.srs != null ? last.srs / 100 : null;
    d.srOverride = ov.srText || '';
    d.firstSeasonIndex = d.rows.length ? seasonById[d.rows[0].seasonId].index : Infinity;
  });
  const driverById = Object.fromEntries(drivers.map(d => [d.id, d]));

  // standings for every season (hand-added drivers show in the current season even with no races yet)
  seasons.forEach(se => {
    const list = drivers.map(d => {
      const rows = d.rows.filter(r => r.seasonId === se.id);
      if (!rows.length && !(se === current && d.manual)) return null;
      const rowsByRace = Object.fromEntries(rows.map(r => [r.raceId, r]));
      return Object.assign({ d, rows, rowsByRace }, aggregate(rows));
    }).filter(Boolean);
    list.sort((a, b) => ((b.races > 0) - (a.races > 0)) || b.points - a.points || b.wins - a.wins || ((a.avgFinish == null ? 99 : a.avgFinish) - (b.avgFinish == null ? 99 : b.avgFinish)) || a.d.name.localeCompare(b.d.name));
    // drivers who have not raced yet are listed but not ranked
    list.forEach((st, i) => { st.standing = st.races > 0 ? i + 1 : null; st.behind = list[0].points - st.points; });
    se.standings = list;
    se.byId = Object.fromEntries(list.map(st => [st.d.id, st]));
  });

  // awards: worked out for every season (the current one is a projection) and handed out only for completed seasons
  drivers.forEach(d => { d.titles = []; d.champion = []; d.cleanest = []; d.mostImproved = []; d.rookie = []; });
  const manualPick = (se, key) => {
    const id = (seasonOv[se.id] || {})[key];
    const d = id != null && id !== '' ? driverById[Number(id)] : null;
    return d ? { d, st: se.byId[d.id] || null, manual: true } : null;
  };
  seasons.forEach(se => {
    const seasonLen = se.complete ? se.raceCount : Math.max(se.raceCount, cfg.racesPerSeason);
    const left = Math.max(0, seasonLen - se.raceCount);
    const required = Math.max(1, Math.ceil(seasonLen * cfg.awards.cleanestMinRaces / cfg.racesPerSeason));
    // cleanest: fewest total incident points among drivers who made (or can still make) the minimum number of starts
    const cleanest = se.standings.filter(st => st.races > 0 && st.races + left >= required)
      .map(st => ({ d: st.d, st, qualified: st.races >= required, needs: Math.max(0, required - st.races) }))
      .sort((a, b) => a.st.inc - b.st.inc || a.st.standing - b.st.standing);
    // most improved: biggest jump in the standings from last season (both seasons need at least half the races)
    const half = (s) => Math.ceil(s.raceCount / 2);
    let improved = [];
    if (se.index > 0){
      const prev = seasons[se.index - 1];
      improved = se.standings.map(st => { const was = prev.byId[st.d.id]; return was && was.standing != null && st.standing != null && was.races >= half(prev) && st.races >= half(se) ? { d: st.d, st, was, gain: was.standing - st.standing } : null; })
        .filter(x => x && x.gain > 0).sort((a, b) => b.gain - a.gain || a.st.standing - b.st.standing);
    }
    // rookie: best-placed driver in their first season in the league (standings are already in order)
    const rookies = se.index > 0 ? se.standings.filter(st => st.races > 0 && st.d.firstSeasonIndex === se.index).map(st => ({ d: st.d, st })) : [];
    se.awards = { seasonLen, left, required, cleanest, improved, rookies,
      cleanestPick: manualPick(se, 'cleanest') || cleanest[0] || null,
      improvedPick: manualPick(se, 'mostImproved') || (improved[0] ? Object.assign({ manual: false }, improved[0]) : null),
      rookiePick: manualPick(se, 'rookie') || (rookies[0] ? { d: rookies[0].d, st: rookies[0].st, manual: false } : null) };
  });
  seasons.filter(se => se.complete && se.raceCount > 0 && se.standings.length).forEach(se => {
    se.standings[0].d.titles.push(se.id);
    const aw = se.awards, c = aw.cleanestPick && aw.cleanestPick.manual ? aw.cleanestPick : aw.cleanest.find(x => x.qualified);
    if (c) c.d.cleanest.push(se.id);
    if (aw.improvedPick) aw.improvedPick.d.mostImproved.push(se.id);
    if (aw.rookiePick) aw.rookiePick.d.rookie.push(se.id);
  });
  // titles the league added by hand (seasons that are not in the data); ignored once a season with that name exists
  const priorTitles = (data.priorTitles || []).filter(x => x && x.year != null && x.year !== '' && x.driver != null && x.driver !== '' && driverById[Number(x.driver)])
    .map(x => ({ year: Number(x.year), season: String(x.season || '').trim(), d: driverById[Number(x.driver)] }));
  const manualTitlesFor = (year) => priorTitles.filter(x => x.year === year && !(x.season && seasons.some(se => se.year === year && se.name.toLowerCase() === x.season.toLowerCase())));
  const byYear = {};
  seasons.forEach(se => { (byYear[se.year] = byYear[se.year] || []).push(se); });
  Object.keys(byYear).forEach(y => {
    const group = byYear[y];
    if (group.every(se => se.complete && se.raceCount > 0 && se.standings.length)){
      const winners = group.map(se => se.standings[0].d).concat(manualTitlesFor(Number(y)).map(x => x.d));
      if (winners.length >= cfg.seasonsPerYear && winners.every(w => w === winners[0])) winners[0].champion.push(String(y));
    }
  });

  // career and current-season summaries
  drivers.forEach(d => {
    const car = aggregate(d.rows);
    car.streak = car.bestStreak === 0 ? null : car.bestStreak === 1 ? '1 win' : `${car.bestStreak} in a row`;
    d.career = car;
    d.cur = current && current.byId[d.id] ? current.byId[d.id] : null;
    d.standingsPosition = d.cur ? d.cur.standing : null;
  });

  const tierFor = (pos) => {
    if (pos == null) return UNRANKED;
    const T = cfg.tiers;
    return T.find(t => pos >= t.min && pos <= t.max) || (pos < T[0].min ? T[0] : T[T.length - 1]);
  };

  return { cfg, teams, teamById, seasons, seasonById, drivers, driverById, priorTitles, manualTitlesFor, current, tierFor, teamFor, dashCache: {}, historyCache: {} };
}
const UNRANKED = { name: 'Unranked', min: 0, max: 0, color: '#6B7280' };
const tierFor = (pos) => L.tierFor(pos);
const posText = (n) => n == null ? '—' : ordinal(n);
const teamOf = (d, seasonId) => { const id = L.teamFor(d.id, seasonId); return id && L.teamById[id] ? L.teamById[id] : null; };
const currentTeam = (d) => L.current ? teamOf(d, L.current.id) : null;
const seasonLabel = (id) => (L.seasonById[id] ? L.seasonById[id].name : String(id));
const shortCar = (n) => String(n || '').replace(/^NASCAR Cup Series Next Gen /, '');
const srText = (d) => d.srOverride ? d.srOverride : d.sr == null ? '—' : `${licenseClass(d.srl)} ${d.sr.toFixed(2)}`;

/* ------------------------------ The Dash For Cash ------------------------------ */
// Top finishers after the final race are paid from the pot on the season's last races.
// Each driver's incident points over those races = the % deducted from their base payout;
// all deductions fund the Clean Bonus Pool, shared out by cleanliness rank.
function getDash(sid){
  if (L.dashCache[sid]) return L.dashCache[sid];
  const se = L.seasonById[sid], cfg = L.cfg, dc = cfg.dash;
  const ranked = se.standings.filter(st => st.standing != null);
  const places = Math.min(dc.base.length, ranked.length);
  const startWeek = se.complete ? Math.max(1, se.raceCount - dc.finalRaces + 1) : cfg.racesPerSeason - dc.finalRaces + 1;
  let res;
  if (!dc.enabled) res = { state: 'disabled', se };
  else if (se.raceCount < startWeek) res = { state: 'notStarted', se, startWeek };
  else {
    const windowRaces = se.races.filter(r => r.week >= startWeek);
    const incOf = (st) => windowRaces.map(r => st.rowsByRace[r.id] ? st.rowsByRace[r.id].inc : null);
    const rows = ranked.slice(0, places).map((st, i) => {
      const mults = incOf(st);
      const incPts = sumOf(mults, x => x || 0);
      const pct = Math.min(dc.maxDeductionPct, incPts);
      const baseC = Math.round(dc.base[i] * 100);
      const dedC = Math.round(baseC * pct / 100);
      return { d: st.d, st, pos: i + 1, mults, incPts, pct, baseC, dedC, afterC: baseC - dedC };
    });
    const order = [...rows].sort((a, b) => (a.incPts - b.incPts) || (a.pos - b.pos));
    const poolC = sumOf(rows, r => r.dedC);
    let paid = 0;
    order.forEach((r, i) => {
      r.cleanRank = i + 1;
      r.share = dc.share[i] || 0;
      r.bonusC = Math.floor(poolC * r.share / 100);
      paid += r.bonusC;
    });
    if (order.length) order[0].bonusC += poolC - paid;       // leftover cents go to the cleanest driver
    rows.forEach(r => { r.finalC = r.afterC + r.bonusC; r.diffC = r.finalC - r.baseC; });
    const payoutOrder = [...rows].sort((a, b) => b.finalC - a.finalC);
    rows.forEach(r => { r.payoutRank = payoutOrder.indexOf(r) + 1; });
    const cutPts = rows.length ? rows[rows.length - 1].st.points : 0;
    const out = ranked.slice(places).map(st => {
      const mults = incOf(st);
      return { d: st.d, st, pos: st.standing, behind: cutPts - st.points, mults, incPts: sumOf(mults, x => x || 0) };
    });
    res = { state: 'ok', se, provisional: !se.complete, startWeek, windowRaces, rows, out, poolC,
      basePaidC: sumOf(rows, r => r.afterC), cutPts, places };
  }
  return (L.dashCache[sid] = res);
}
// A driver's Dash For Cash career across completed seasons.
function dashCareer(d){
  let earnedC = 0, inMoney = 0, seasons = 0; const ranks = [];
  L.seasons.filter(se => se.complete && se.byId[d.id] && se.byId[d.id].races > 0).forEach(se => {
    seasons++;
    const dd = getDash(se.id);
    if (dd.state !== 'ok') return;
    const row = dd.rows.find(r => r.d === d);
    if (row){ earnedC += row.finalC; inMoney++; ranks.push(row.cleanRank); }
  });
  return { earnedC, inMoney, seasons, ranks, avgClean: ranks.length ? sumOf(ranks, x => x) / ranks.length : null };
}
function rankHistory(d){
  const counts = L.cfg.tiers.map(t => ({ tier: t, count: 0 }));
  L.seasons.filter(se => se.complete && se.byId[d.id] && se.byId[d.id].races > 0).forEach(se => {
    const t = tierFor(se.byId[d.id].standing);
    counts.find(c => c.tier === t).count++;
  });
  return counts.filter(c => c.count > 0);
}

/* ------------------------------ teams ------------------------------ */
// average of a stat over members who have actually raced this season
function avgOver(members, key){
  const raced = members.filter(d => d.cur.races > 0);
  return raced.length ? sumOf(raced, d => d.cur[key]) / raced.length : null;
}

function buildTeams(){
  const cur = L.current;
  const teams = L.teams.map(t => {
    const members = cur ? L.drivers.filter(d => d.cur && currentTeam(d) === t).sort((a, b) => (a.standingsPosition ?? 999) - (b.standingsPosition ?? 999)) : [];
    const h = getTeamHistory(t.id);
    const tot = h.reduce((a, e) => { Object.keys(a).forEach(k => { a[k] += e.totals[k]; }); return a; }, emptyTotals());
    return {
      id: t.id, name: t.name, color: t.color, members,
      cars: [...new Set(members.map(d => shortCar(d.car)))],
      wins: sumOf(members, d => d.cur.wins), top5: sumOf(members, d => d.cur.top5), top10: sumOf(members, d => d.cur.top10),
      poles: sumOf(members, d => d.cur.poles), points: sumOf(members, d => d.cur.points),
      lapsLed: sumOf(members, d => d.cur.lapsLed), dnfs: sumOf(members, d => d.cur.dnfs),
      avgFinish: avgOver(members, 'avgFinish'),
      incRace: avgOver(members, 'incRace'),
      cWins: tot.wins, cPoints: tot.points,
      cTitles: sumOf(h, e => e.titles.length), cChamps: sumOf(h, e => e.champion.length),
    };
  });
  teams.sort((a, b) => b.points - a.points || b.wins - a.wins);
  let rank = 0;
  teams.forEach(t => { t.standing = t.members.some(d => d.cur.races > 0) ? ++rank : null; });
  return teams;
}

function emptyTotals(){ return { points: 0, wins: 0, top5: 0, top10: 0, poles: 0, inc: 0, dnfs: 0, races: 0 }; }

// Every driver who raced for a team, grouped into stints of consecutive seasons.
function getTeamHistory(teamId){
  if (L.historyCache[teamId]) return L.historyCache[teamId];
  const cur = L.current;
  const entries = [];
  L.drivers.forEach(d => {
    const rows = d.rows.filter(r => r.teamId === teamId);
    if (!rows.length) return;
    const idxs = [...new Set(rows.map(r => L.seasonById[r.seasonId].index))].sort((a, b) => a - b);
    let i = 0;
    while (i < idxs.length){
      let j = i;
      while (j + 1 < idxs.length && idxs[j + 1] === idxs[j] + 1) j++;
      const stintSeasons = L.seasons.filter(se => se.index >= idxs[i] && se.index <= idxs[j]);
      const ids = new Set(stintSeasons.map(se => se.id));
      const stintRows = rows.filter(r => ids.has(r.seasonId));
      const a = aggregate(stintRows);
      const years = [...new Set(stintSeasons.map(se => se.year))];
      const present = !!cur && ids.has(cur.id);
      const now = cur && d.cur ? currentTeam(d) : null;
      entries.push({
        d, name: d.name, number: d.number, seasons: stintSeasons,
        startLabel: stintSeasons[0].name, endLabel: stintSeasons[stintSeasons.length - 1].name,
        startYear: Math.min(...years), endYear: Math.max(...years), present,
        status: present ? 'current' : (d.cur && now ? 'former' : 'historic'), nowWith: now ? now.name : null,
        totals: { points: a.points, wins: a.wins, top5: a.top5, top10: a.top10, poles: a.poles, inc: a.inc, dnfs: a.dnfs, races: a.races },
        titles: d.titles.filter(id => ids.has(id)),
        champion: d.champion.filter(y => years.includes(Number(y))),
      });
      i = j + 1;
    }
  });
  // drivers added by hand who are on the team this season but have no race yet
  if (cur) L.drivers.forEach(d => {
    if (d.cur && d.cur.races === 0 && currentTeam(d) && currentTeam(d).id === teamId){
      entries.push({ d, name: d.name, number: d.number, seasons: [cur], startLabel: cur.name, endLabel: cur.name,
        startYear: cur.year, endYear: cur.year, present: true, status: 'current', nowWith: null,
        totals: { points: 0, wins: 0, top5: 0, top10: 0, poles: 0, inc: 0, dnfs: 0, races: 0 }, titles: [], champion: [] });
    }
  });
  return (L.historyCache[teamId] = entries);
}

// Dash For Cash results for a team: every time one of its drivers made the tournament while driving for it.
function teamDashStats(teamId){
  const byDriver = new Map(), apps = [];
  L.seasons.filter(se => se.complete).forEach(se => {
    const dd = getDash(se.id);
    if (dd.state !== 'ok') return;
    dd.rows.forEach(r => {
      if (r.st.rows[0].teamId !== teamId) return;
      const e = { d: r.d, seasonId: se.id, pos: r.payoutRank, finalC: r.finalC };
      apps.push(e);
      if (!byDriver.has(r.d)) byDriver.set(r.d, []);
      byDriver.get(r.d).push(e);
    });
  });
  const avg = (f) => apps.length ? sumOf(apps, f) / apps.length : null;
  return { apps, byDriver, count: apps.length, avgPos: avg(e => e.pos), totalC: sumOf(apps, e => e.finalC),
    best: apps.length ? Math.min(...apps.map(e => e.pos)) : null };
}

function seasonSummary(d, se){
  const rows = d.rows.filter(r => r.seasonId === se.id);
  const a = aggregate(rows), st = se.byId[d.id];
  const awards = [];
  if (d.titles.includes(se.id)) awards.push('Season Title');
  if (d.champion.includes(String(se.year)) && se.index === Math.max(...L.seasons.filter(x => x.year === se.year).map(x => x.index))) awards.push('Champion of the Year');
  if (d.cleanest.includes(se.id)) awards.push('Cleanest Driver Award');
  if (d.mostImproved.includes(se.id)) awards.push('Most Improved Driver');
  if (d.rookie.includes(se.id)) awards.push('Rookie of the Season');
  return Object.assign({ rows, standing: st.standing, tier: tierFor(st.standing), awards }, a);
}

function dashSeasonLine(d, se){
  const dd = getDash(se.id);
  if (dd.state === 'disabled') return '';
  if (dd.state === 'notStarted') return `Dash For Cash: begins at Race ${dd.startWeek}`;
  const row = dd.rows.find(r => r.d === d);
  const tag = dd.provisional ? ' <span class="dim">(live — season in progress)</span>' : '';
  if (row) return `Dash For Cash: <b>${ordinal(row.pos)}</b> · ${dd.provisional ? 'projected' : 'earned'} <b>${money(row.finalC)}</b> · cleanliness rank <b>#${row.cleanRank}</b>${tag}`;
  const o = dd.out.find(r => r.d === d);
  return `Dash For Cash: <b>Out of the money</b>${o && o.behind > 0 ? ` · ${o.behind} pts behind the cut` : ''}${tag}`;
}

        <span class="count">${s.races} race${s.races === 1 ? '' : 's'}</span>
      </summary>
      <div class="log-table-wrap">
        <table class="log-table">
          <thead><tr><th>Wk</th><th>Date</th><th>Track</th><th>Start</th><th>Fin</th><th>Status</th><th>Interval</th><th>Laps Led</th><th>Laps Comp</th><th>Inc</th><th>Pts</th></tr></thead>
          <tbody>${raceRows(s.rows)}</tbody>
          <tfoot><tr class="totals-row"><td colspan="11"><div class="totals-flex">
            <div class="season-totals">
              <span><b>${s.wins}</b> Wins · <b>${s.top5}</b> Top 5 · <b>${s.top10}</b> Top 10 · <b>${fmt(s.points)}</b> Pts</span>
              <span><b>${fmt(s.lapsLed)}</b> Laps Led · <b>${fmt(s.lapsRun)}</b> Laps Run · <b>${s.inc}</b> Inc Pts · <b>${s.dnfs}</b> DNFs</span>
              <span>${se.complete ? 'Final' : 'Current'} standing: <b>${ordinal(s.standing)}</b></span>
              <span>${se.complete ? 'Final' : 'Current'} rank: <b style="color:${esc(s.tier.color)}">${esc(s.tier.name.toUpperCase())}</b></span>
              <span class="${s.awards.length ? 'award-yes' : 'award-no'}">${esc(awardText)}</span>
              ${dashLine ? `<span>${dashLine}</span>` : ''}
            </div>
            ${L.cfg.dash.enabled ? `<button class="dash-btn" onclick="go('dash-${se.id}')">Dash For Cash standings &rarr;</button>` : ''}
          </div></td></tr></tfoot>
        </table>
      </div>
    </details>`;
  };

  const yearBlocks = years.map((y, idx) => {
    const ss = mySeasons.filter(se => se.year === y).sort((a, b) => b.index - a.index);
    return `
    <details class="year-acc" ${idx === 0 ? 'open' : ''}>
      <summary>${y} <span class="count">${sumOf(ss, se => se.byId[d.id].races)} races</span></summary>
      <div class="year-body">${ss.map(seasonBlock).join('')}</div>
    </details>`;
  }).join('');

  if (!mySeasons.length){
    setApp(`<div class="log-wrap"><button class="back-link" onclick="go('driver-${d.id}')">&larr; ${esc(d.name)}'s Career Card</button>${emptyState('No races yet', `${esc(d.name)} has no race results in the league data yet.`)}</div>`);
    return;
  }
  setApp(`
    <div class="log-wrap">
      <button class="back-link" onclick="go('driver-${d.id}')">&larr; ${esc(d.name)}'s Career Card</button>
      <div class="page-title">
        <h1>#${esc(d.number)} ${esc(d.name)} — Career Performance Log</h1>
        <p>${d.career.races} RACE${d.career.races === 1 ? '' : 'S'} · ${mySeasons.length} SEASON${mySeasons.length === 1 ? '' : 'S'}</p>
      </div>
      ${yearBlocks}
    </div>`);
}

          <div class="rules-cols">

          </div>
          <h3>2. INCIDENT PENALTY RULE (LAST ${dc.finalRaces} RACES ONLY)</h3>
          <p>Each driver's incident points for every race in the window are added up. That total is the percentage deducted from the driver's base payout${dc.maxDeductionPct < 100 || true ? ` (never more than ${dc.maxDeductionPct}%)` : ''}, and all deducted money goes into the Clean Bonus Pool.</p>
          <h3>FINAL PAYOUT</h3>

/* ------------------------------ Home hub ------------------------------ */
// Everything on the Home page is generated from the race results: the recap and storylines are
// written from facts (winner, gaps, positions gained, incidents, standings movement), never invented.

const hashPick = (arr, seed) => arr[Math.abs(Math.floor(seed)) % arr.length];
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const dLink = (d) => `<button class="hub-link" onclick="openDriverMenu(event, this, ${d.id})">${esc(d.name)}</button>`;
const tLink = (t) => `<a class="hub-link" href="#team-${esc(t.id)}" style="color:${esc(t.color)}">${esc(t.name)}</a>`;
const shortDate = (iso) => new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const shortTrack = (t) => String(t).replace(/\s+(Oval|Speedway|Raceway|Motor Speedway|International Speedway)\b.*$/i, '').replace(/^(EchoPark|World Wide Technology)\s+/i, '') || t;

function compareStanding(a, b){
  return b.points - a.points || b.wins - a.wins || ((a.avgFinish == null ? 99 : a.avgFinish) - (b.avgFinish == null ? 99 : b.avgFinish)) || a.d.name.localeCompare(b.d.name);
}
// the season standings as they stood after the first k races
function standingsAfter(se, k){
  const list = L.drivers.map(d => {
    const rows = d.rows.filter(r => r.seasonId === se.id && r.week <= k);
    return rows.length ? Object.assign({ d, rows }, aggregate(rows)) : null;
  }).filter(Boolean).sort(compareStanding);
  list.forEach((s, i) => { s.standing = i + 1; });
  return list;
}

/* ---- the latest race ---- */
function raceFacts(se, race){
  const rows = race.results.map(res => ({ res, d: L.driverById[res.c] })).filter(x => x.d).sort((a, b) => a.res.fin - b.res.fin);
  if (!rows.length) return null;
  const before = standingsAfter(se, race.week - 1), after = standingsAfter(se, race.week);
  const prevPos = Object.fromEntries(before.map(s => [s.d.id, s.standing]));
  const winner = rows[0], second = rows[1] || null, third = rows[2] || null;
  const pole = rows.find(x => x.res.st === 1) || null;
  const ran = rows.filter(x => x.res.out === 'Running');
  const prior = (d) => d.rows.filter(r => new Date(r.date) < new Date(race.date));
  const wRows = winner.d.rows.filter(r => r.seasonId === se.id && r.week <= race.week);
  const seasonWins = wRows.filter(r => r.finish === 1).length;
  let streak = 0;
  for (let i = wRows.length - 1; i >= 0 && wRows[i].finish === 1; i--) streak++;
  const movers = ran.map(x => ({ x, gain: x.res.st - x.res.fin })).sort((a, b) => b.gain - a.gain);
  const fallers = rows.filter(x => x.res.st <= 10).map(x => ({ x, loss: x.res.fin - x.res.st })).sort((a, b) => b.loss - a.loss);
  const mostLed = [...rows].sort((a, b) => b.res.ll - a.res.ll)[0];
  const dnfs = rows.filter(x => x.res.out !== 'Running' && x.res.lc < Math.max(...rows.map(y => y.res.lc)) * 0.9);
  const totalInc = sumOf(rows, x => x.res.inc);
  const dirtiest = [...rows].sort((a, b) => b.res.inc - a.res.inc)[0];
  const clean = rows.filter(x => x.res.inc === 0);
  return {
    rows, winner, second, third, pole, ran, before, after, prevPos, seasonWins, streak, movers, fallers, mostLed,
    dnfs, totalInc, dirtiest, clean,
    gap2: second && second.res.iv > 0 ? second.res.iv / 10000 : null,
    firstEver: prior(winner.d).filter(r => r.finish === 1).length === 0,
    starts: prior(winner.d).length + 1,
    leaderBefore: before[0] || null, leaderAfter: after[0] || null,
  };
}

function raceStory(se, race){
  const f = raceFacts(se, race);
  if (!f) return null;
  const W = f.winner, wd = W.d, seed = race.id;
  const track = race.track;
  const lapsLed = W.res.ll, total = race.laps || Math.max(...f.rows.map(x => x.res.lc));
  const wTeam = teamOf(wd, se.id);
  const items = [];
  const add = (tag, title, text) => items.push({ tag, title, text });

  // headline and deck
  let headline, deck;
  if (f.firstEver){
    headline = `${wd.name} breaks through for a first career win at ${shortTrack(track)}`;
    deck = `After ${plural(f.starts - 1, 'start')}, ${dLink(wd)} takes the checkered flag from ${W.res.st === 1 ? 'the pole' : ordinal(W.res.st) + ' on the grid'}.`;
  } else if (f.gap2 != null && f.gap2 < 0.5){
    headline = `${wd.name} edges ${f.second.d.name} in a photo finish at ${shortTrack(track)}`;
    deck = `Just ${f.gap2.toFixed(3)} seconds separated ${dLink(wd)} from ${dLink(f.second.d)} at the line.`;
  } else if (W.res.st === 1 && lapsLed >= total * 0.6){
    headline = `${wd.name} dominates at ${shortTrack(track)}`;
    deck = `${dLink(wd)} started on the pole and led ${lapsLed} of ${total} laps on the way to win number ${f.seasonWins}${f.seasonWins === 1 ? '' : ' this season'}.`;
  } else if (W.res.st >= 8){
    headline = `${wd.name} rallies from ${ordinal(W.res.st)} to win at ${shortTrack(track)}`;
    deck = `${dLink(wd)} drove through the field after starting ${ordinal(W.res.st)}, gaining ${W.res.st - 1} positions to take the win.`;
  } else {
    headline = hashPick([`${wd.name} wins at ${shortTrack(track)}`, `${wd.name} takes victory at ${shortTrack(track)}`], seed);
    deck = `${dLink(wd)} starts ${ordinal(W.res.st)} and takes the win${wTeam ? ' for ' + esc(wTeam.name) : ''}${f.gap2 != null ? `, ${f.gap2.toFixed(3)} seconds clear of ${esc(f.second.d.name)}` : ''}.`;
  }

  // storylines
  if (f.streak >= 2) add('Streak', `${f.streak} wins in a row`, `${dLink(wd)} has now won ${f.streak} straight races, the longest active streak in the league.`);
  else if (f.seasonWins >= 2 && !f.firstEver) add('Win', `Win number ${f.seasonWins} of the season`, `${dLink(wd)} moves to ${plural(f.seasonWins, 'win')} this season${f.seasonWins >= Math.max(...L.drivers.filter(d => d.cur).map(d => d.cur.wins)) ? ', the most in the league' : ''}.`);

  const lb = f.leaderBefore, la = f.leaderAfter;
  if (la){
    const gap = f.after[1] ? la.points - f.after[1].points : 0;
    if (lb && lb.d !== la.d) add('Championship', `${la.d.name} takes the points lead`, `${dLink(la.d)} moves to the top of the standings with ${fmt(la.points)} points, ${gap > 0 ? plural(gap, 'point') + ' ahead of ' + esc(f.after[1].d.name) : 'level with ' + esc(f.after[1].d.name)}. ${dLink(lb.d)} drops to ${ordinal(f.after.findIndex(s => s.d === lb.d) + 1)}.`);
    else if (lb) add('Championship', `${la.d.name} extends the lead`, `${dLink(la.d)} stays on top with ${fmt(la.points)} points and now leads ${esc(f.after[1] ? f.after[1].d.name : 'the field')} by ${gap}.`);
  }

  const climber = f.movers[0];
  if (climber && climber.gain >= 5 && climber.x !== W) add('Hard charger', `${climber.x.d.name} gains ${climber.gain} spots`, `${dLink(climber.x.d)} started ${ordinal(climber.x.res.st)} and finished ${ordinal(climber.x.res.fin)}, the biggest move of the day.`);

  if (f.pole && f.pole !== W){
    const p = f.pole;
    add(p.res.fin <= 3 ? 'Pole' : 'Heartbreak', p.res.fin <= 3 ? `${p.d.name} sets the pace from the pole` : `Pole sitter ${p.d.name} fades`,
      p.res.fin <= 3 ? `${dLink(p.d)} started on the pole and held on for ${ordinal(p.res.fin)}.`
        : `${dLink(p.d)} led the field to green but ${p.res.out !== 'Running' ? 'did not make it to the finish' : 'slipped back to ' + ordinal(p.res.fin)}.`);
  }
  if (f.mostLed && f.mostLed !== W && f.mostLed.res.ll >= total * 0.25)
    add('Led the most', `${f.mostLed.d.name} led ${f.mostLed.res.ll} laps but missed out`, `${dLink(f.mostLed.d)} led ${f.mostLed.res.ll} of ${total} laps and still finished ${ordinal(f.mostLed.res.fin)}.`);

  if (f.dnfs.length >= 3) add('Carnage', `${plural(f.dnfs.length, 'car')} fail to finish`, `${f.dnfs.slice(0, 3).map(x => dLink(x.d)).join(', ')}${f.dnfs.length > 3 ? ' and ' + (f.dnfs.length - 3) + ' more' : ''} saw their races end early.`);
  else if (f.dnfs.length) add('DNF', `${f.dnfs.map(x => esc(x.d.name)).join(' and ')} ${f.dnfs.length === 1 ? 'is' : 'are'} out early`, `${f.dnfs.map(x => dLink(x.d)).join(' and ')} did not see the end of the race.`);

  const cleanTop = f.rows.slice(0, 5).filter(x => x.res.inc === 0 && x !== W);
  if (cleanTop.length) add('Clean', `Clean racing up front`, `${cleanTop.slice(0, 3).map(x => dLink(x.d)).join(', ')} finished in the top five without a single incident point.`);
  if (f.dirtiest && f.dirtiest.res.inc >= 8) add('Incidents', `${f.dirtiest.d.name} takes a ${f.dirtiest.res.inc}x beating`, `${dLink(f.dirtiest.d)} picked up ${f.dirtiest.res.inc} incident points, the most in the race.`);

  const byTeam = {};
  f.rows.slice(0, 10).forEach(x => { const t = teamOf(x.d, se.id); if (t) (byTeam[t.id] = byTeam[t.id] || { t, n: 0 }).n++; });
  const topTeam = Object.values(byTeam).sort((a, b) => b.n - a.n)[0];
  if (topTeam && topTeam.n >= 3) add('Team', `${topTeam.t.name} dominates the top ten`, `${tLink(topTeam.t)} placed ${topTeam.n} cars in the top ten.`);

  const facts = [];
  if (f.pole) facts.push(['Pole', f.pole.d.name]);
  if (race.cautions) facts.push(['Cautions', race.cautions]);
  if (race.leadChanges) facts.push(['Lead changes', race.leadChanges]);
  facts.push(['Field', `${f.rows.length} cars`]);
  facts.push(['Incident points', f.totalInc]);
  facts.push(['Clean drivers', f.clean.length]);
  return { f, headline, deck, items, facts, race, se };
}

/* ---- the season story ---- */
function seasonStory(se){
  const ranked = se.standings.filter(s => s.standing != null);
  if (!ranked.length) return [];
  const out = [];
  const add = (tag, title, text) => out.push({ tag, title, text });
  const n = se.raceCount, M = L.cfg.racesPerSeason, toGo = Math.max(0, M - n);
  const leader = ranked[0], second = ranked[1], third = ranked[2];
  const winsOf = (s) => s.wins;
  const winners = ranked.filter(s => s.wins > 0).sort((a, b) => b.wins - a.wins);

  // the championship picture
  if (second){
    const gap = leader.points - second.points;
    const close = ranked.filter(s => leader.points - s.points <= Math.max(10, leader.points * 0.08)).length;
    let t;
    if (n === 1) t = `${dLink(leader.d)} opens the season with a win and a ${gap}-point lead over ${esc(second.d.name)}.`;
    else if (gap <= 5) t = `${dLink(leader.d)} (${fmt(leader.points)}) and ${dLink(second.d)} (${fmt(second.points)}) are separated by just ${plural(gap, 'point')}${toGo ? ` with ${plural(toGo, 'race')} to go` : ''}.`;
    else t = `${dLink(leader.d)} leads with ${fmt(leader.points)} points, ${gap} clear of ${dLink(second.d)}${third ? ' and ' + (leader.points - third.points) + ' ahead of ' + esc(third.d.name) : ''}${toGo ? `, with ${plural(toGo, 'race')} remaining` : ''}.`;
    if (close >= 4 && n > 1) t += ` ${plural(close, 'driver')} are within striking distance of the lead.`;
    add('Championship', gap <= 5 && n > 1 ? 'A championship on a knife edge' : `${leader.d.name} leads the way`, t);
  }

  // parity or domination
  if (n >= 3 && winners.length){
    const top = winners[0];
    if (winners.length >= Math.ceil(n * 0.7)) add('Parity', `${plural(winners.length, 'different winner')} in ${plural(n, 'race')}`, `Nobody owns this season: ${winners.slice(0, 4).map(s => dLink(s.d)).join(', ')}${winners.length > 4 ? ' and others' : ''} have all been to victory lane.`);
    else if (top.wins >= Math.ceil(n / 3)) add('Dominance', `${top.d.name} is the one to beat`, `${dLink(top.d)} has ${plural(top.wins, 'win')} in ${plural(n, 'race')}${winners[1] ? `, while ${dLink(winners[1].d)} is next best with ${winners[1].wins}` : ''}.`);
    else add('Winners', `${plural(winners.length, 'driver')} have won this season`, `${winners.slice(0, 4).map(s => `${dLink(s.d)} (${s.wins})`).join(', ')}${winners.length > 4 ? ' and more' : ''}.`);
  }

  // winless leader / consistency
  if (n >= 4 && leader.wins === 0) add('Consistency', 'Leading without a win', `${dLink(leader.d)} sits on top of the standings with no victories, averaging a ${leader.avgFinish.toFixed(1)} finish.`);
  else if (n >= 4){
    const steady = ranked.filter(s => s.races === n && s.avgFinish != null).sort((a, b) => a.avgFinish - b.avgFinish)[0];
    if (steady) add('Consistency', `${steady.d.name} is the most consistent`, `${dLink(steady.d)} owns the best average finish at ${steady.avgFinish.toFixed(1)}, with ${plural(steady.top10, 'top ten')} in ${plural(n, 'start')}.`);
  }

  // form guide: points over the last three races vs the field
  if (n >= 4){
    const recent = se.races.slice(-3).map(r => r.week);
    const form = ranked.map(s => ({ s, pts: sumOf(s.rows.filter(r => recent.includes(r.week)), r => r.points), n: s.rows.filter(r => recent.includes(r.week)).length }))
      .filter(x => x.n >= 2).sort((a, b) => b.pts / b.n - a.pts / a.n);
    if (form.length){
      const hot = form[0];
      add('Form', `${hot.s.d.name} is the hottest driver`, `${dLink(hot.s.d)} has scored ${hot.pts} points over the last ${plural(recent.length, 'race')}, the best recent form in the league.`);
    }
  }

  // dominance on track: laps led and poles
  const ledLeader = [...ranked].sort((a, b) => b.lapsLed - a.lapsLed)[0];
  const totalLed = sumOf(ranked, s => s.lapsLed);
  if (ledLeader && ledLeader.lapsLed > 0 && n >= 2) add('Up front', `${ledLeader.d.name} leads the laps`, `${dLink(ledLeader.d)} has led ${fmt(ledLeader.lapsLed)} laps (${Math.round(ledLeader.lapsLed / totalLed * 100)}% of all laps led this season)${ledLeader.poles ? ` and has started on the pole ${plural(ledLeader.poles, 'time')}` : ''}.`);

  // clean and dirty
  const regulars = ranked.filter(s => s.races >= Math.max(2, Math.ceil(n * 0.6)));
  if (n >= 3 && regulars.length >= 4){
    const sorted = [...regulars].sort((a, b) => a.incRace - b.incRace);
    add('Clean racing', `${sorted[0].d.name} is the cleanest driver`, `${dLink(sorted[0].d)} averages just ${sorted[0].incRace.toFixed(1)} incident points per race. At the other end, ${dLink(sorted[sorted.length - 1].d)} averages ${sorted[sorted.length - 1].incRace.toFixed(1)}.`);
  }

  // teams
  const teams = L.teams.length ? buildTeams().filter(t => t.standing) : [];
  if (teams.length >= 2 && n >= 2){
    const t1 = teams[0], t2 = teams[1];
    add('Team battle', `${t1.name} leads the team standings`, `${tLink(t1)} has ${fmt(t1.points)} combined points from ${plural(t1.members.filter(d => d.cur.races > 0).length, 'driver')}, ${fmt(t1.points - t2.points)} ahead of ${tLink(t2)}.${t1.wins ? ` The team has ${plural(t1.wins, 'win')} this season.` : ''}`);
  }

  // the Dash For Cash
  const dc = L.cfg.dash;
  if (dc.enabled){
    const startWeek = M - dc.finalRaces + 1, cut = dc.base.length;
    const lastIn = ranked[cut - 1], firstOut = ranked[cut];
    const dd = getDash(se.id);
    if (dd.state === 'notStarted' && lastIn){
      const k = startWeek - n;
      add('Dash For Cash', k === 1 ? 'The Dash For Cash starts next race' : `${plural(k, 'race')} until the Dash For Cash`,
        `The final ${dc.finalRaces} races pay out a $${fmt(dc.pot)} pool to the top ${cut}. ${dLink(lastIn.d)} holds the last paid spot with ${fmt(lastIn.points)} points${firstOut ? `, just ${plural(lastIn.points - firstOut.points, 'point')} ahead of ${dLink(firstOut.d)}` : ''}.`);
    } else if (dd.state === 'ok' && dd.provisional){
      const top = [...dd.rows].sort((a, b) => b.finalC - a.finalC)[0];
      add('Dash For Cash', 'The Dash For Cash is live', `The projected top earner is ${dLink(top.d)} at ${money(top.finalC)}. The cut line sits at ${fmt(dd.cutPts)} points with ${plural(M - n, 'race')} left to move it.`);
    } else if (dd.state === 'ok'){
      const top = [...dd.rows].sort((a, b) => b.finalC - a.finalC)[0];
      add('Dash For Cash', 'The Dash For Cash is settled', `${dLink(top.d)} took home the biggest payout at ${money(top.finalC)}.`);
    }
  }
  return out;
}

/* ---- the page ---- */
function arrowFor(prev, cur){
  if (prev == null) return '<span class="mv new">NEW</span>';
  const d = prev - cur;
  return d > 0 ? `<span class="mv up">▲${d}</span>` : d < 0 ? `<span class="mv down">▼${-d}</span>` : '<span class="mv same">–</span>';
}

/* ---- schedule ---- */
function todayISO(){
  const n = new Date(), p = (v) => String(v).padStart(2, '0');
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
}
function fmtDay(iso){
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
function scheduleItems(){
  return (DATA.schedule || [])
    .filter(x => x && x.track && /^\d{4}-\d{2}-\d{2}/.test(String(x.date)))
    .map(x => ({ track: x.track, date: String(x.date).slice(0, 10) }))
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
// Scheduled races that have not happened yet (today's date counts), soonest first.
function upcomingRaces(){
  const today = todayISO(), done = new Set((DATA.races || []).map(r => String(r.date).slice(0, 10)));
  return scheduleItems().filter(x => x.date >= today && !done.has(x.date));
}
function scheduleSection(){
  const items = scheduleItems();
  if (!items.length) return '';
  const up = upcomingRaces(), next = up[0];
  const chips = items.map(x => {
    const isNext = !!next && x.date === next.date && x.track === next.track;
    const isUp = up.some(u => u.date === x.date && u.track === x.track);
    const [y, m, d] = x.date.split('-').map(Number);
    const md = new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return `<div class="ss-chip ${isNext ? 'next' : isUp ? '' : 'done'}" title="${esc(x.track)} · ${fmtDay(x.date)}"><span class="ssc-d">${md}</span><span class="ssc-t">${esc(shortTrack(x.track))}</span></div>`;
  }).join('');
  setTimeout(() => { const s = document.querySelector('.ss-scroll'), n = s && s.querySelector('.next'); if (s && n){ s.scrollLeft = Math.max(0, n.offsetLeft - 8); if (s.scrollLeft > 2) s.classList.add('fade-l'); } }, 0);
  return `<div class="ss"><div class="ss-label">SCHEDULE</div><div class="ss-scroll">${chips}</div></div>`;
}

/* ---- Awards Race box ---- */
function seededRand(seed){
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// Title odds: simulate the rest of the season many times. Each driver's future races are drawn from their own
// race-by-race points so far (and how often they actually show up), then added to today's points total.
function titleOdds(se){
  const ranked = se.standings.filter(s => s.standing != null);
  if (!ranked.length) return { rows: [], left: 0, clinched: false };
  const left = se.complete ? 0 : Math.max(0, L.cfg.racesPerSeason - se.raceCount);
  const leader = ranked[0];
  const maxPts = Math.max(44, ...se.races.flatMap(r => r.results.map(x => x.pts || 0)));
  const pool = ranked.filter(s => s.points + left * maxPts >= leader.points);
  const fin = (st, pct, clinched) => ({ d: st.d, st, pct, label: clinched ? '100%' : pct < 1 ? '<1%' : Math.min(99, Math.round(pct)) + '%' });
  if (left === 0 || pool.length === 1) return { rows: [fin(leader, 100, true)], left, clinched: true };
  const N = 6000, wins = pool.map(() => 0);
  const rnd = seededRand(se.raceCount * 1000003 + Math.round(leader.points) * 7919 + (se.id & 0xffff));
  const vals = pool.map(s => s.rows.map(r => r.points)), part = pool.map(s => s.races / se.raceCount);
  for (let n = 0; n < N; n++){
    let best = 0, bestPts = -1;
    for (let i = 0; i < pool.length; i++){
      let t = pool[i].points;
      for (let k = 0; k < left; k++) if (rnd() < part[i]) t += vals[i][Math.floor(rnd() * vals[i].length)];
      if (t > bestPts){ bestPts = t; best = i; }
    }
    wins[best]++;
  }
  const rows = pool.map((s, i) => fin(s, wins[i] / N * 100, false)).filter(r => r.pct > 0).sort((a, b) => b.pct - a.pct);
  return { rows, left, clinched: false };
}
// Champion of the Year: the same driver wins the title in every season of the calendar year
function championProjection(se, odds){
  const per = L.cfg.seasonsPerYear, fav = odds.rows[0] || null;
  if (per === 1) return { yes: !!fav, text: fav ? `${fav.d.name} is the projected champion of ${se.year}.` : '' };
  // earlier seasons of this year: the ones in the data plus any title the league added by hand
  const entries = L.seasons.filter(s => s.year === se.year && s.index < se.index)
    .map(s => ({ d: s.complete && s.standings[0] && s.standings[0].races > 0 ? s.standings[0].d : null, name: s.name }))
    .concat(L.manualTitlesFor(se.year).map(x => ({ d: x.d, name: x.season || 'an earlier season' })));
  if (entries.length < per - 1) return { yes: false, text: `${se.name} is season ${entries.length + 1} of ${per} in ${se.year}. A driver must win the title in every season of the year.` };
  const w = entries[0].d;
  if (!w || entries.some(x => x.d !== w)) return { yes: false, text: `No single driver has won every earlier season of ${se.year}.` };
  const mine = odds.rows.find(r => r.d === w), isFav = !!fav && fav.d === w;
  const won = entries.map(x => /^an? /i.test(x.name) ? x.name : `the ${x.name}`).join(' and ');
  const raced = se.byId[w.id] && se.byId[w.id].races > 0;
  const candidate = { d: w, pct: mine ? mine.pct : 0, label: mine ? mine.label : '0%' };
  const text = se.complete
    ? (isFav ? `${w.name} won ${won} and won this season too.` : `${w.name} won ${won} but did not win ${se.name}.`)
    : isFav ? `${w.name} won ${won} and is the projected favorite to win ${se.name} too.`
    : `${w.name} won ${won}${raced ? ' but is not the projected favorite for ' + se.name + '.' : ' but has not raced in ' + se.name + ' yet.'}`;
  return { yes: isFav, candidate, text };
}
function awardsCard(se){
  const aw = se.awards, odds = titleOdds(se);
  if (!aw || !odds.rows.length) return '';
  const champ = championProjection(se, odds);
  const tag = (t) => `<span class="aw-tag">${t}</span>`;
  const oddsRows = odds.rows.slice(0, 5).map(r => `<div class="aw-odds"><span class="ao-name">${dLink(r.d)}</span><span class="ao-bar"><i style="width:${Math.max(3, r.pct)}%"></i></span><b>${r.label}</b></div>`).join('');
  const cl = aw.cleanestPick, mi = aw.improvedPick, rk = aw.rookiePick;
  const clean = cl
    ? `<div class="aw-v">${dLink(cl.d)}${cl.manual ? tag('LEAGUE PICK') : ''}</div><div class="aw-s">${cl.st ? `${fmt(cl.st.inc)} incident pts · ${cl.st.races} of ${aw.seasonLen} starts${cl.manual || cl.qualified ? '' : ` · needs ${plural(cl.needs, 'more start')}`}` : 'Chosen by the league'}</div>`
    : `<div class="aw-s">No driver is on pace for ${aw.required} of ${aw.seasonLen} starts yet.</div>`;
  const improved = mi
    ? `<div class="aw-v">${dLink(mi.d)}${mi.manual ? tag('LEAGUE PICK') : ''}</div><div class="aw-s">${mi.manual ? (mi.st && mi.st.standing ? `Currently ${ordinal(mi.st.standing)} in the standings` : 'Chosen by the league') : `Up ${plural(mi.gain, 'spot')}: ${ordinal(mi.was.standing)} last season to ${ordinal(mi.st.standing)} now`}</div>`
    : `<div class="aw-s">${se.index === 0 ? 'Needs a previous season to compare against.' : 'No driver has moved up from last season yet.'}</div>`;
  const rookie = rk
    ? `<div class="aw-v">${dLink(rk.d)}${rk.manual ? tag('LEAGUE PICK') : ''}</div><div class="aw-s">${rk.st && rk.st.standing ? `${ordinal(rk.st.standing)} in the standings` : 'Chosen by the league'}</div>`
    : `<div class="aw-s">No first-year driver has raced yet.</div>`;
  return `<div class="hub-panel awards"><div class="hp-title">AWARDS RACE <span>${esc(se.name)} · ${se.complete ? 'final' : `projected · ${plural(aw.left, 'race')} to go`}</span></div>
    <div class="awards-grid">
      <div><div class="aw-k">SEASON TITLE ODDS</div>${oddsRows}
        <div class="aw-s" style="margin-top:6px">${odds.clinched ? (se.complete ? 'Final result.' : 'Title clinched: no one else can catch the leader.') : 'Simulated from the points standings, each driver’s scoring pace and the races left.'}</div></div>
      <div>
        <div class="aw-item"><div class="aw-k">CHAMPION OF THE YEAR</div><div class="aw-v"><span class="yn ${champ.yes ? 'yes' : 'no'}">${champ.yes ? 'YES' : 'NO'}</span></div>${champ.candidate ? `<div class="aw-odds"><span class="ao-name">${dLink(champ.candidate.d)}</span><span class="ao-bar"><i style="width:${Math.max(3, champ.candidate.pct)}%"></i></span><b>${champ.candidate.label}</b></div>` : ''}<div class="aw-s">${esc(champ.text)}</div></div>
        <div class="aw-item"><div class="aw-k">CLEANEST DRIVER</div>${clean}</div>
        <div class="aw-item"><div class="aw-k">MOST IMPROVED</div>${improved}</div>
        <div class="aw-item"><div class="aw-k">ROOKIE OF THE YEAR</div>${rookie}</div>
      </div>
    </div>
    <details class="aw-rules"><summary>How awards are decided</summary><ul>
      <li><b>Season title:</b> most points after the final race.</li>
      <li><b>Champion of the Year:</b> the same driver wins the title in all ${L.cfg.seasonsPerYear} seasons of the calendar year.</li>
      <li><b>Cleanest driver:</b> fewest total incident points, with at least ${aw.required} of ${aw.seasonLen} races run, or chosen by the league.</li>
      <li><b>Most improved:</b> biggest climb in the standings from last season (at least half the races run in both seasons), or chosen by the league.</li>
      <li><b>Rookie of the year:</b> best-placed driver with no earlier racing history in the league, or chosen by the league.</li>
    </ul></details></div>`;
}

  const top10 = f.rows.slice(0, 10).map(x => `

      <td>${x.res.ll}</td><td>${x.res.inc}</td><td class="c-pts">${x.res.pts}</td></tr>`).join('');

  // ---- a newsroom layout: a tabbed feed on the left, standings widgets on the right ----
  const feedItem = (it, i) => `
    <li class="feed-item"><div class="feed-dot">${i + 1}</div>
      <div class="feed-body"><span class="feed-tag">${esc(it.tag)}</span><div class="feed-title">${esc(it.title)}</div><div class="feed-text">${it.text}</div></div></li>`;
  const feed = (items, empty) => items.length ? `<ul class="feed">${items.map(feedItem).join('')}</ul>` : `<div class="dim feed-empty">${empty}</div>`;

  const champRows = f.after.slice(0, 5).map(s => `

      <td class="${s.standing > 1 ? 'neg' : ''}">${s.standing > 1 ? '-' + (f.after[0].points - s.points) : 'Leader'}</td></tr>`).join('');

  const recent = se.races.slice(-3).map(r => r.week);
  const form = ranked.map(s => ({ s, rs: s.rows.filter(r => recent.includes(r.week)) })).filter(x => x.rs.length >= Math.min(2, recent.length))
    .map(x => ({ s: x.s, avg: sumOf(x.rs, r => r.points) / x.rs.length, pts: sumOf(x.rs, r => r.points), fin: sumOf(x.rs, r => r.finish) / x.rs.length }))
    .sort((a, b) => b.avg - a.avg).slice(0, 5);

  const leadersOf = (label, key, fmtv) => {
    const best = [...ranked].sort((a, b) => b[key] - a[key])[0];
    return best && best[key] > 0 ? `<div class="lead-row"><span>${label}</span><span><button class="hub-link" onclick="openDriverMenu(event, this, ${best.d.id})">${esc(best.d.name)}</button> <b>${fmtv ? fmtv(best[key]) : best[key]}</b></span></div>` : '';
  };
  const regulars = ranked.filter(s => s.races >= Math.max(2, Math.ceil(se.raceCount * 0.6)));
  const cleanest = regulars.length >= 3 ? [...regulars].sort((a, b) => a.incRace - b.incRace)[0] : null;
  const distinct = new Set(se.races.map(r => { const w = r.results.find(x => x.fin === 1); return w && w.c; })).size;

  // every race of the season in one table
  const seasonRows = [...se.races].reverse().map(r => {
    const w = r.results.find(x => x.fin === 1), wd = w ? L.driverById[w.c] : null;
    const pole = r.results.find(x => x.st === 1), pd = pole ? L.driverById[pole.c] : null;
    const sec = r.results.find(x => x.fin === 2);
    return `<tr><td><b>R${r.week}</b></td><td>${shortDate(r.date)}</td><td class="c-name">${esc(shortTrack(r.track))}</td>
      <td>${wd ? `<button class="hub-link" onclick="openDriverMenu(event, this, ${wd.id})">${esc(wd.name)}</button>` : '-'}</td>
      <td>${sec && sec.iv > 0 ? (sec.iv / 10000).toFixed(3) + 's' : '-'}</td>
      <td>${pd ? `<button class="hub-link" onclick="openDriverMenu(event, this, ${pd.id})">${esc(pd.name)}</button>` : '-'}</td><td>${r.results.length}</td></tr>`;
  }).join('');

  // Dash For Cash watch
  const dc = L.cfg.dash;
  let dashBody = '';
  if (dc.enabled){
    const dd = getDash(se.id), cut = dc.base.length, lastIn = ranked[cut - 1], firstOut = ranked[cut];
    if (dd.state === 'notStarted'){
      const k = dd.startWeek - se.raceCount;
      dashBody = `<div class="dw-big">${k <= 1 ? 'Starts next race' : plural(k, 'race') + ' to go'}</div>
        <div class="dw-sub">Races ${dd.startWeek}–${L.cfg.racesPerSeason} pay a $${fmt(dc.pot)} pool to the top ${cut}.</div>
        ${lastIn ? `<div class="lead-row"><span>Last in the money</span><span>${dLink(lastIn.d)} <b>${fmt(lastIn.points)}</b></span></div>` : ''}
        ${firstOut ? `<div class="lead-row"><span>First out</span><span>${dLink(firstOut.d)} <b>${fmt(firstOut.points)}</b></span></div>
        <div class="lead-row"><span>Bubble gap</span><span><b>${lastIn.points - firstOut.points}</b> pts</span></div>` : ''}`;
    } else if (dd.state === 'ok'){
      const top3 = [...dd.rows].sort((a, b) => b.finalC - a.finalC).slice(0, 3);
      dashBody = `<div class="dw-big">${dd.provisional ? 'Live now' : 'Final payouts'}</div>
        <div class="dw-sub">${dd.provisional ? 'Projected top earners' : 'Biggest payouts'} · cut line ${fmt(dd.cutPts)} pts</div>
        ${top3.map((r, i) => `<div class="lead-row"><span>${i + 1}. ${dLink(r.d)}</span><span><b>${money(r.finalC)}</b></span></div>`).join('')}`;
    }
  }

  const sideCards = `
    <div class="hub-panel"><div class="hp-title">CHAMPIONSHIP TOP 5 <a href="#drivers">Full standings &rarr;</a></div>
      <table class="mini-tbl"><thead><tr><th>#</th><th>Driver</th><th></th><th>W</th><th>Pts</th><th>Gap</th></tr></thead><tbody>${champRows}</tbody></table></div>
    ${dashBody ? `<div class="hub-panel"><div class="hp-title">DASH FOR CASH WATCH <a href="#dash">Open &rarr;</a></div>${dashBody}</div>` : ''}
    <div class="hub-panel"><div class="hp-title">FORM GUIDE · LAST ${recent.length} RACES</div>
      ${form.map((x, i) => `<div class="lead-row"><span>${i + 1}. <button class="hub-link" onclick="openDriverMenu(event, this, ${x.s.d.id})">${esc(x.s.d.name)}</button></span><span><b>${x.pts}</b> pts</span></div>`).join('') || '<div class="dim">Not enough races yet.</div>'}</div>
    <div class="hub-panel"><div class="hp-title">SEASON LEADERS</div>

      ${cleanest ? `<div class="lead-row"><span>Cleanest</span><span><button class="hub-link" onclick="openDriverMenu(event, this, ${cleanest.d.id})">${esc(cleanest.d.name)}</button> <b>${cleanest.incRace.toFixed(1)}/race</b></span></div>` : ''}</div>`;

  const extraCards = `
